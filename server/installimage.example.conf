# Example Hetzner installimage config for a build server (Ubuntu 24.04, two NVMe disks in RAID 1, 8 GB swap).
# Adjust DRIVE1/DRIVE2 to the device names the rescue system shows (lsblk) and pick your own HOSTNAME.
# Run in the rescue system: installimage -a -c installimage.example.conf
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
HOSTNAME build-server
USE_KERNEL_MODE_SETTING yes
PART swap swap 8G
PART /boot ext3 1024M
PART / ext4 all
IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst
