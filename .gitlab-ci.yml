# Publishes the intro page with GitLab Pages. The repo's own documents are linked to GitLab's rendered Markdown views.
# Shared runners on this instance run tagged jobs only; adjust the tag and image to your instance.
pages:
  stage: deploy
  tags:
    - docker
  image: alpine:latest
  script:
    - mkdir -p public
    - cp site/index.html public/index.html
    - sed -i "s#\.\./docs/#$CI_PROJECT_URL/-/blob/$CI_DEFAULT_BRANCH/docs/#g; s#\.\./README\.md#$CI_PROJECT_URL/-/blob/$CI_DEFAULT_BRANCH/README.md#g" public/index.html
    # The clone command on the page points at this GitLab project, not at GitHub.
    - sed -i "s#https://github\.com/bussard76/agentic-factory\.git#$CI_PROJECT_URL.git#g" public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
