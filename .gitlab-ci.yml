# Publishes the intro page with GitLab Pages. The page links to this repository's documents, releases and README on GitHub;
# the copy published here has those links rewritten to this GitLab project's own views, so a reader stays on this instance.
# The release link goes to the tag view, not a release page: a tag exists wherever it was pushed, a release page only where someone published one.
# Shared runners on this instance run tagged jobs only; adjust the tag and image to your instance.
pages:
  stage: deploy
  tags:
    - docker
  image: alpine:latest
  script:
    - mkdir -p public
    - cp site/index.html public/index.html
    - sed -i "s|https://github\.com/bussard76/agentic-factory/blob/main/|$CI_PROJECT_URL/-/blob/$CI_DEFAULT_BRANCH/|g; s|https://github\.com/bussard76/agentic-factory/releases/tag/|$CI_PROJECT_URL/-/tags/|g; s|https://github\.com/bussard76/agentic-factory#readme|$CI_PROJECT_URL/-/blob/$CI_DEFAULT_BRANCH/README.md|g" public/index.html
    # The clone command on the page points at this GitLab project, not at GitHub.
    - sed -i "s|https://github\.com/bussard76/agentic-factory\.git|$CI_PROJECT_URL.git|g" public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Creates the GitLab release page for a version tag from releases/<tag>.md, with the job's own token (CI_JOB_TOKEN, no secret variables).
# A release that already exists, such as a hand-written one, is left alone. A tag without a notes file fails the job.
# Shared runners on this instance run tagged jobs only, and the CLI image must be one your runners can pull: adjust the tag and image to your instance.
# The script uses `glab release create`, not the `release:` keyword, because that keyword fails the job when the release exists.
# Needs a GitLab version whose job token may use the Releases API; GitLab's documentation names no version for that, so the first run proves it.
# Only tags like v1.2.3 get a release (no pre-release suffixes).
.gitlab-release:
  stage: deploy
  tags:
    - docker
  image: registry.gitlab.com/gitlab-org/cli:v1.133.0

gitlab-release:
  extends: .gitlab-release
  script:
    - sh scripts/gitlab-release.sh "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Backfill: tag pipelines do not run again for old tags. Start this job by hand in a pipeline of the default branch to create the
# release for every releases/<tag>.md whose tag is on the remote and has no release yet, dated like the tag. It can be run again at any time.
# allow_failure is true because a manual job in rules would otherwise block the pipeline until someone starts it. A failed run therefore
# shows as an orange warning, not a red pipeline: open the job's log, which ends with a "BACKFILL FAILED for:" line.
gitlab-release-backfill:
  extends: .gitlab-release
  script:
    - sh scripts/gitlab-release.sh --backfill
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
